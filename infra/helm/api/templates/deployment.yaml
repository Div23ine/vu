{{- $env := list
  (dict "name" "NODE_ENV" "value" .Values.config.nodeEnv)
  (dict "name" "PORT" "value" (toString .Values.port))
  (dict "name" "WEB_ORIGIN" "value" .Values.config.webOrigin)
  (dict "name" "API_PUBLIC_URL" "value" .Values.config.apiUrl)
  (dict "name" "SECRETS_PROVIDER" "value" "oci-vault")
  (dict "name" "OCI_SECRET_MAP" "value" (.Values.ociSecretMap | toJson))
-}}
{{- if .Values.config.sentryDsn }}
{{- $env = append $env (dict "name" "SENTRY_DSN" "value" .Values.config.sentryDsn) -}}
{{- end }}
{{- if .Values.config.scanControllerCidrs }}
{{- $env = append $env (dict "name" "SCAN_CONTROLLER_CIDRS" "value" .Values.config.scanControllerCidrs) -}}
{{- end }}
{{- include "vv-lib.deployment" (dict
  "ctx" $
  "name" "api"
  "image" .Values.image
  "replicas" .Values.replicaCount
  "serviceAccountName" .Values.serviceAccount.name
  "env" $env
  "port" .Values.port
  "probe" (dict "path" "/healthz" "port" .Values.port)
  "resources" .Values.resources
  "nodeSelector" .Values.nodeSelector
  "tolerations" .Values.tolerations
) }}
