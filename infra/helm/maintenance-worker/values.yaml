# vv-maintenance-worker values (Task 100). NO secret values here — OCIDs and plain
# configuration only. image.tag comes from CI; an empty tag fails the template.

image:
  repository: "" # <registry>/vv/maintenance-worker
  tag: ""
  digest: ""

replicaCount: 2

serviceAccount:
  name: vv-maintenance-worker
  annotations: {}

# Plain environment (the worker's Zod schema defaults cover anything absent).
env:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  MAINTENANCE_CONCURRENCY: "2"
  LOGIN_ATTEMPT_RETENTION_DAYS: "30"
  INVITATION_GRACE_HOURS: "0"
  DORMANT_AFTER_DAYS: "90"
  SIGNUP_STALE_DAYS: "7"
  OUTBOX_STUCK_MINUTES: "2"
  R2_ACCOUNT_ID: ""
  R2_BUCKET: ""
  R2_PUBLIC_BASE_URL: "https://assets.vunvault.example"
  AUDIT_HMAC_KEY_ID: "v1"
  AUDIT_ALERT_EMAIL: ""

# ENV_NAME -> OCI Vault secret OCID (Task 98 `secret_ocids` output).
# Empty OCIDs are skipped by the template; fill per environment.
vaultSecrets:
  REDIS_URL: ""
  DATABASE_URL: ""
  R2_ACCESS_KEY_ID: ""
  R2_SECRET_ACCESS_KEY: ""
  AUDIT_HMAC_KEY: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector: {}
tolerations: []
