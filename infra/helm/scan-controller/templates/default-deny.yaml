# Default-deny for the scan namespace (Task 86): both directions, both policy
# types. Per-job egress policies (the controller's network-policy.ts) are the
# only openings; cluster DNS, pod/service CIDRs and the metadata address are
# allowed nowhere — a scan pod cannot even resolve a name it could reach.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: vv-scan
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
