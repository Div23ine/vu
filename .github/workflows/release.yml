name: release

# Build, scan, sign and push the six images (Task 102). Called by deploy.yml
# for a commit, or dispatched by hand for a re-release of an existing SHA.
# Keyless cosign (GitHub OIDC) — no signing key exists to steal.

on:
  workflow_call:
    inputs:
      git_sha:
        required: true
        type: string
    outputs:
      digests_artifact:
        description: Name of the artifact carrying digests.json
        value: digests
  workflow_dispatch:
    inputs:
      git_sha:
        description: Full commit SHA to release
        required: true
        type: string

permissions:
  contents: read
  id-token: write # cosign keyless signing
  security-events: write # trivy image SARIF

env:
  REGISTRY: ${{ vars.OCIR_REGISTRY }}
  TAG: ${{ inputs.git_sha }}

jobs:
  # Named `images`, not `release`: image builds are environment-agnostic
  # (content-addressed digests); the ENVIRONMENTS gate deploys, not artifacts.
  images:
    name: bake, scan, sign, push
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.git_sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.OCIR_REGISTRY }}
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_AUTH_TOKEN }}

      - uses: ./.github/actions/setup

      - name: Bake and push every image
        # The base-image digests and tool versions/checksums are repository
        # VARIABLES set by the operator — nothing floating is ever committed.
        run: |
          set -euo pipefail
          REGISTRY="${REGISTRY}" TAG="${TAG}" \
          GIT_SHA="${{ inputs.git_sha }}" CREATED="$(date -u +%FT%TZ)" \
          NODE_BUILD_IMAGE="${{ vars.NODE_BUILD_IMAGE }}" \
          DISTROLESS_IMAGE="${{ vars.DISTROLESS_IMAGE }}" \
          NMAP_VERSION="${{ vars.NMAP_VERSION }}" NMAP_PACKAGE="${{ vars.NMAP_PACKAGE }}" \
          NUCLEI_VERSION="${{ vars.NUCLEI_VERSION }}" NUCLEI_SHA256="${{ vars.NUCLEI_SHA256 }}" \
          HTTPX_VERSION="${{ vars.HTTPX_VERSION }}" HTTPX_SHA256="${{ vars.HTTPX_SHA256 }}" \
          TESTSSL_VERSION="${{ vars.TESTSSL_VERSION }}" TESTSSL_SHA256="${{ vars.TESTSSL_SHA256 }}" \
          NUCLEI_TEMPLATES_REF="${{ vars.NUCLEI_TEMPLATES_REF }}" \
          docker buildx bake --push --provenance mode=max --sbom \
            --metadata-file bake-metadata.json

      - name: Collect the pushed digests
        id: digests
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const meta = JSON.parse(fs.readFileSync("bake-metadata.json", "utf8"));
            const out = {};
            for (const [target, entry] of Object.entries(meta)) {
              const ref = (entry["image.name"] ?? [])[0] ?? "";
              const digest = (entry["containerimage.digest"] ?? "");
              if (digest) out[target] = { ref: ref.split("@")[0], digest };
            }
            fs.mkdirSync("artifacts", { recursive: true });
            fs.writeFileSync("artifacts/digests.json", JSON.stringify(out, null, 2));
            console.log(JSON.stringify(out, null, 2));
          '

      - name: Scan every pushed image (CRITICAL fails the release)
        run: |
          set -euo pipefail
          node -e '
            const { execFileSync } = require("node:child_process");
            const images = JSON.parse(require("node:fs").readFileSync("artifacts/digests.json", "utf8"));
            for (const [name, image] of Object.entries(images)) {
              console.log(`scanning ${name}: ${image.ref}@${image.digest}`);
              execFileSync("docker", ["run", "--rm",
                "-v", "/var/run/docker.sock:/var/run/docker.sock",
                "aquasec/trivy:latest", "image",
                "--severity", "CRITICAL", "--exit-code", "1", "--ignore-unfixed",
                `${image.ref}@${image.digest}`], { stdio: "inherit" });
            }
          '

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign every pushed image (keyless)
        run: |
          set -euo pipefail
          node -e '
            const { execFileSync } = require("node:child_process");
            const images = JSON.parse(require("node:fs").readFileSync("artifacts/digests.json", "utf8"));
            for (const image of Object.values(images)) {
              const ref = `${image.ref}@${image.digest}`;
              execFileSync("cosign", ["sign", "--yes", ref], { stdio: "inherit" });
            }
          '

      - uses: actions/upload-artifact@v4
        with:
          name: digests
          path: artifacts/digests.json
          retention-days: 90
          if-no-files-found: error
