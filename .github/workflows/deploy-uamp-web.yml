name: deploy-uamp-web

# UAMP HQ is deployed independently from the VUNVAULT web frontend.
# This workflow is manual-only: adding it does not deploy anything by itself.
# The production GitHub Environment must require reviewer approval.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: UAMP HQ deployment environment
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: deploy-uamp-web-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy standalone UAMP HQ frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and deploy UAMP HQ only
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_AUTH_URL: ${{ vars.NEXT_PUBLIC_AUTH_URL }}
          NEXT_PUBLIC_R2_HOST: ${{ vars.NEXT_PUBLIC_R2_HOST }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_API_URL"
          test -n "$NEXT_PUBLIC_SITE_URL"
          test -n "$NEXT_PUBLIC_AUTH_URL"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          case "${{ inputs.environment }}" in
            staging)
              pnpm --filter uamp-web cf:deploy:staging
              ;;
            production)
              pnpm --filter uamp-web cf:deploy:production
              ;;
            *)
              echo "Unsupported UAMP deployment environment" >&2
              exit 1
              ;;
          esac
