# Per-environment Helm overrides — STAGING (Task 110 deploy kit).
#
# scripts/deploy/helm-deploy.sh feeds this file to EVERY chart automatically
# (keys a chart does not declare are ignored; Helm deep-merges maps). It is
# loaded AFTER the chart's own values.yaml and BEFORE the CD's --set flags,
# so image coordinates and the Vault OCID maps still come from CI.
#
# No secrets here — hostnames, sizes and replicas only. Replace
# `vunvault.example` with your real zone (the staging subdomain scheme comes
# from infra/terraform/cloudflare: api.staging.<zone>, www.staging.<zone>,
# origin.staging.<zone>, assets.staging.<zone>).

replicaCount: 1 # staging runs single-replica; production doubles it

config:
  webOrigin: https://www.staging.vunvault.example
  apiUrl: https://api.staging.vunvault.example
  apiInternalUrl: https://api.staging.vunvault.example

ingress:
  enabled: true
  host: origin.staging.vunvault.example

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
