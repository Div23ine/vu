# vv-broadcast-worker values (Task 100). NO secret values here — OCIDs and plain
# configuration only. image.tag comes from CI; an empty tag fails the template.

image:
  repository: "" # <registry>/vv/broadcast-worker
  tag: ""
  digest: ""

replicaCount: 2

serviceAccount:
  name: vv-broadcast-worker
  annotations: {}

# Plain environment (the worker's Zod schema defaults cover anything absent).
env:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  BROADCAST_CONCURRENCY: "2"
  PROGRESS_THROTTLE_MS: "2000"
  COUNTER_FLUSH_EVERY: "25"
  REDIS_KEY_PREFIX: "vv"
  TWILIO_FROM: ""

# ENV_NAME -> OCI Vault secret OCID (Task 98 `secret_ocids` output).
# Empty OCIDs are skipped by the template; fill per environment.
vaultSecrets:
  REDIS_URL: ""
  DATABASE_URL: ""
  RESEND_API_KEY: ""
  AFRICASTALKING_USERNAME: ""
  AFRICASTALKING_API_KEY: ""
  TWILIO_ACCOUNT_SID: ""
  TWILIO_AUTH_TOKEN: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector: {}
tolerations: []
