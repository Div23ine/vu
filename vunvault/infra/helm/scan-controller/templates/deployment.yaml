{{- $env := list
  (dict "name" "NODE_ENV" "value" (.Values.config.nodeEnv | quote))
  (dict "name" "LOG_LEVEL" "value" (.Values.config.logLevel | quote))
  (dict "name" "API_INTERNAL_URL" "value" (.Values.config.apiInternalUrl | quote))
  (dict "name" "WORKER_SLOTS_TOTAL" "value" (.Values.config.workerSlotsTotal | quote))
  (dict "name" "REDIS_KEY_PREFIX" "value" (.Values.config.redisKeyPrefix | quote))
  (dict "name" "API_TIMEOUT_MS" "value" (.Values.config.apiTimeoutMs | quote))
-}}
{{- include "vv-lib.deployment" (dict
  "ctx" $
  "name" "scan-controller"
  "image" .Values.image
  "replicas" .Values.replicaCount
  "serviceAccountName" .Values.serviceAccount.controller
  "env" $env
  "envFrom" (list .Values.secretRef)
  "port" 0
  "resources" .Values.resources
  "nodeSelector" .Values.nodeSelector
) }}
