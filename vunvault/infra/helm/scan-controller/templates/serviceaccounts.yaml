{{- include "vv-lib.serviceAccount" (dict "ctx" $ "name" "scan-controller" "serviceAccountName" .Values.serviceAccount.controller "annotations" dict) }}
---
# The runner account has NO Role, NO RoleBinding and NO mounted token: it
# exists because Kubernetes requires a named account, and a scan pod running
# attacker-chosen tooling against a customer host must find nothing to steal.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.runner }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: vv-scan
    app.kubernetes.io/part-of: vunvault
automountServiceAccountToken: false
