apiVersion: v1
kind: LimitRange
metadata:
  name: vv-scans-limits
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: vv-scan
spec:
  limits:
    - type: Container
      default:
        cpu: {{ .Values.limitRange.defaultCpu | quote }}
        memory: {{ .Values.limitRange.defaultMemory }}
      defaultRequest:
        cpu: {{ .Values.limitRange.defaultRequestCpu | quote }}
        memory: {{ .Values.limitRange.defaultRequestMemory }}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: vv-scans-quota
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: vv-scan
spec:
  hard:
    pods: {{ .Values.quota.pods | quote }}
    requests.cpu: {{ .Values.quota.requestsCpu | quote }}
    limits.cpu: {{ .Values.quota.limitsCpu | quote }}
    limits.memory: {{ .Values.quota.limitsMemory }}
