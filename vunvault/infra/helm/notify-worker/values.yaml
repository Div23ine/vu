# vv-notify-worker values (Task 100). NO secret values here — OCIDs and plain
# configuration only. image.tag comes from CI; an empty tag fails the template.

image:
  repository: "" # <registry>/vv/notify-worker
  tag: ""
  digest: ""

replicaCount: 2

serviceAccount:
  name: vv-notify-worker
  annotations: {}

# Plain environment (the worker's Zod schema defaults cover anything absent).
env:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  NOTIFY_CONCURRENCY: "8"
  PDF_CONCURRENCY: "2"
  REDIS_KEY_PREFIX: "vv"
  TWILIO_FROM: ""
  WEB_ORIGIN: "https://www.vunvault.example"
  R2_ACCOUNT_ID: ""
  R2_BUCKET: ""
  R2_PUBLIC_BASE_URL: "https://assets.vunvault.example"

# ENV_NAME -> OCI Vault secret OCID (Task 98 `secret_ocids` output).
# Empty OCIDs are skipped by the template; fill per environment.
vaultSecrets:
  REDIS_URL: ""
  DATABASE_URL: ""
  RESEND_API_KEY: ""
  AFRICASTALKING_USERNAME: ""
  AFRICASTALKING_API_KEY: ""
  TWILIO_ACCOUNT_SID: ""
  TWILIO_AUTH_TOKEN: ""
  R2_ACCESS_KEY_ID: ""
  R2_SECRET_ACCESS_KEY: ""

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1
    memory: 1Gi

nodeSelector: {}
tolerations: []
