{{- $env := list -}}
{{- range $key, $value := .Values.env }}
{{- if ne $value "" }}
{{- $env = append $env (dict "name" $key "value" ($value | quote)) -}}
{{- end }}
{{- end }}
{{- include "vv-lib.deployment" (dict
  "ctx" $
  "name" "notify-worker"
  "image" .Values.image
  "replicas" .Values.replicaCount
  "serviceAccountName" .Values.serviceAccount.name
  "env" $env
  "envFrom" (list (printf "vv-notify-worker-secrets"))
  "port" 0
  "resources" .Values.resources
  "nodeSelector" .Values.nodeSelector
  "tolerations" .Values.tolerations
) }}
