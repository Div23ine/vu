# Hadolint (Task 101/102). The Dockerfiles pin base images through BUILD ARGS
# (digests supplied by CI), so hadolint's untagged/pin complaints about the
# ARG indirection are the only tolerated noise.
ignored:
  # Base images arrive as ${NODE_BUILD_IMAGE}/${DISTROLESS_IMAGE} — pinned by
  # digest at build time by CI; hadolint cannot see through the ARG.
  - DL3006
  - DL3007
  # The runner image installs pinned tools from upstream archives verified
  # with sha256sum -c (its Dockerfile enforces this); apt pinning to the
  # debian archive's current version is deliberate and documented.
  - DL3008
failure-threshold: error
