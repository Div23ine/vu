# Default-deny for the scan namespace (Task 86).
#
# Both directions, both policy types: nothing enters a scan pod and nothing
# leaves it except what a per-job policy (`src/k8s/network-policy.ts`) explicitly
# allows. Because a per-job policy selects `Egress` only, this document is what
# keeps ingress closed for the whole life of the pod.
#
# Note what is NOT allowed anywhere: cluster DNS, the pod and service CIDRs, and
# the cloud metadata address. A scan pod has `dnsPolicy: None` and a dead
# nameserver, so it cannot resolve a name even if it could reach one.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: vv-scans
  labels:
    app.kubernetes.io/name: vv-scan
spec:
  # An empty podSelector selects every pod in the namespace.
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
