# Dependency updates (Task 101). Grouped minor/patch so the PR count stays
# reviewable; majors arrive individually because they are where breakage lives.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /apps/scan-worker
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /infra/terraform/oci
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /infra/terraform/cloudflare
    schedule:
      interval: weekly
