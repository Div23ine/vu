name: ci

# The gate on every pull request and every push to main. Least privilege by
# default: nothing here writes to the repository, and no job outlives its
# timeout. `verify` runs first — a policy failure is cheaper to report than a
# five-minute test run that was never going to merge.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Public build-time values only. Nothing here is a secret, and no job may
  # add one: application secrets live in OCI Vault (docs/ci.md).
  NEXT_PUBLIC_API_URL: https://api.vunvault.test
  NEXT_PUBLIC_SITE_URL: https://www.vunvault.test

jobs:
  verify:
    name: policy, lint and types
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Policy scripts
        run: pnpm verify
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck

  test:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: verify
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      - name: Unit and integration suites
        run: pnpm test -- --coverage
      - name: Node policy-script suites
        run: node --test scripts/*.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: builds
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: verify
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      - name: Build packages and services
        run: pnpm build
      - name: Build the web app (edge-compatible)
        run: pnpm --filter web pages:build

  e2e:
    name: browser smoke (playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: verify
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run the E2E suite (dev server + MSW mock layer)
        run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  contracts:
    # Named separately so a conformance regression says which contract broke
    # instead of appearing as one failed test among six hundred.
    name: contract conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: verify
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      - name: API route-table and audit conformance
        run: pnpm --filter api test -- conformance
      - name: Scan-worker isolation conformance
        run: pnpm --filter scan-worker test -- conformance
