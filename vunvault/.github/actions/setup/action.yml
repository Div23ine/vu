name: setup-vunvault-toolchain
description: Node 22 + pnpm via corepack, with the pnpm store cached. Used by every workflow so the toolchain is defined once.
inputs:
  node-version:
    description: Node major to install
    default: "22"
runs:
  using: composite
  steps:
    - name: Install Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Enable pnpm through corepack
      shell: bash
      # corepack reads `packageManager` from the root package.json, so the
      # pnpm version is the one the repo pinned — never a floating latest.
      run: corepack enable && corepack prepare --activate

    - name: Cache the pnpm store
      uses: actions/cache@v4
      with:
        path: ~/.pnpm-store
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-
