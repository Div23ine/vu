# Gitleaks configuration (Task 102).
#
# The default ruleset stands; this file exists ONLY for the allow-list below.
# Every entry is a documented test fixture — a value that was never a secret.
# Adding an entry requires the same review as adding a skip to .trivyignore:
# name the file, name the reason, and prefer fixing the fixture.

[allowlist]
description = "Documented fake keys in test fixtures"
paths = [
  '''packages/contracts/fixtures/''',
  '''.*\.test\.tsx?$''',
  '''.*\.test\.mjs$''',
  '''apps/api/src/routes/v1/webhooks/webhooks.test.ts''',
  '''apps/web/src/mocks/''',
]
# The hex digests in the audit fixtures are 64-char strings that look exactly
# like keys; they are chain hashes, published to admins by design.
regexes = [
  '''[0-9a-f]{64}''',
]
