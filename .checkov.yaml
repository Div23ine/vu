# Checkov policy (Task 98). Scanned in CI (Task 101) over infra/terraform.
# The skip list is short and each entry is a documented platform decision —
# a new skip needs a reviewer who understands why the rule fired.
directory:
  - infra/terraform
framework:
  - terraform
skip-check:
  # The k3s join token and the OCIR pull token live in state BY DESIGN: the
  # backend bucket is private, versioned and CMK-encrypted (see the stack
  # README). The alternative — a secret store round-trip at boot — needs a
  # credential on the node, which is worse on the assumed-compromised tier.
  - CKV_SECRET_*
  # Bastion sessions are ephemeral and CIDR-restricted; no LB sits in front.
  - CKV2_OCI_*
compact: true
quiet: true
