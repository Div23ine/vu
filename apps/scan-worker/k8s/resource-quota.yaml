# Namespace ceiling (Task 86).
#
# A hard cap on what the whole scan namespace can consume, so a queue burst or a
# controller bug cannot exhaust the cluster the API also runs on. 30 pods matches
# the controller's own slot ceiling across replicas.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: vv-scans-quota
  namespace: vv-scans
  labels:
    app.kubernetes.io/name: vv-scan
spec:
  hard:
    pods: "30"
    requests.cpu: "12"
    limits.cpu: "30"
    limits.memory: 40Gi
