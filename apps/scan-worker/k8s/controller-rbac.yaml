# Scan-controller RBAC (Task 86).
#
# Two ServiceAccounts, and the difference between them is the point:
#
#   vv-scan-controller — the controller itself. Namespaced, eight verbs, no
#     `pods/exec`, no secrets, no configmaps, nothing cluster-wide. It can create
#     and delete scan Jobs and their egress policies, and read pod logs. That is
#     the whole of what a scan needs.
#   vv-scan-runner — the account the SCAN POD runs under. It has no Role and no
#     RoleBinding at all, and the manifest sets
#     `automountServiceAccountToken: false`, so there is not even a token in the
#     pod to steal. It exists only because Kubernetes requires a named account.
#
# The absence of `pods/exec` is deliberate and load-bearing: it is why pause and
# resume are no-ops (see `k8s-pod-runner.ts`). Granting exec would let anything
# that compromises the controller also inject commands into a pod running
# attacker-chosen tooling against a customer's host.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vv-scan-controller
  namespace: vv-scans
  labels:
    app.kubernetes.io/name: vv-scan
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vv-scan-runner
  namespace: vv-scans
  labels:
    app.kubernetes.io/name: vv-scan
# No bindings exist for this account, and the pod never mounts its token.
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vv-scan-controller
  namespace: vv-scans
  labels:
    app.kubernetes.io/name: vv-scan
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vv-scan-controller
  namespace: vv-scans
  labels:
    app.kubernetes.io/name: vv-scan
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vv-scan-controller
subjects:
  - kind: ServiceAccount
    name: vv-scan-controller
    namespace: vv-scans
