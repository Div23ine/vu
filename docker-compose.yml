   services:
     db:
       image: postgres:15-alpine
       environment:
         POSTGRES_USER: vunvault
         POSTGRES_PASSWORD: vunvault_password
         POSTGRES_DB: vunvault_db
       ports:
         - "5432:5432"
       volumes:
         - postgres_data:/var/lib/postgresql/data

   volumes:
     postgres_data: